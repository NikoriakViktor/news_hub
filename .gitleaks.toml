# Сканер секретів (gitleaks) для CI: steps/12_ci_cd → .github/workflows/news_hub.yml, job «supply-chain».
# Правила — стандартні gitleaks. Нижче — лише навчальні значення, які книга показує навмисно: одноразові
# секрети з виводу прикладів і підроблені токени з тестів. Кожне — точним рядком, а не цілою папкою:
# справжній секрет у tests/ чи docs/ сканер усе одно знайде.
[extend]
useDefault = true

[[allowlists]]
description = "навчальні значення книги, не секрети"
regexes = [
  # JWT з alg: none — тести перевіряють, що такий токен відхиляється (test_admin_api.py, кроки 8–12)
  '''eyJhbGciOiJub25lIn0\.eyJzdWIiOiJhZG1pbiIsInJvbGUiOiJhZG1pbiJ9\.''',
  # токен «olena», підписаний одноразовим секретом прикладу (08_security/secrets_and_headers.md)
  '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJzdWIiOiJvbGVuYSJ9\.''',
  # одноразовий JWT_SECRET перевірочного стеку (tutorials/11_compose_deploy/env_secrets.md)
  '''CN4Pm7MPiVP7ayN6g6lrqdWqI7YbOQ56Y7yaHljINGHxM0Y2PR38ONyfLzdoFEPq''',
  # явно підроблений секрет прикладу налаштувань (examples/settings/settings_demo.py)
  '''dotenv-secret-0123456789abcdef''',
]
