site_name: News Hub — книга FastAPI
site_description: FastAPI від типів і Pydantic до Docker, Compose і CI/CD — на прикладі новинного агрегатора
site_url: https://nikoriakviktor.github.io/news_hub/
repo_url: https://github.com/NikoriakViktor/news_hub
repo_name: NikoriakViktor/news_hub
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
exclude_docs: |
  _internal/

theme:
  name: material
  language: uk
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.prune
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
  palette:
    - scheme: default
      primary: indigo
      accent: indigo

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      # Unicode-aware slugs: keep Cyrillic headings as anchors (the default slugify drops them)
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

plugins:
  - search:
      lang:
        - uk
        - en
  # Англійська додається пізніше: page.en.md поруч із page.md + мова en нижче (docs_structure: suffix)
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: uk
          default: true
          name: Українська
          build: true

validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: info
    unrecognized_links: warn

nav:
  - Головна: index.md
  - Як користуватися:
    - Вступ: 00_getting_started/README.md
    - Необхідні знання: 00_getting_started/prerequisites.md
    - Налаштування: 00_getting_started/local_setup.md
    - Структура репозиторію: 00_getting_started/repository_structure.md
    - Як читати кроки: 00_getting_started/how_to_use.md
  - Книга FastAPI:
    - "Частина I. HTTP і дизайн REST API":
      - Огляд: 01_http_and_rest/README.md
    - "Частина II. Типи і Pydantic":
      - Огляд: 02_typing_and_pydantic/README.md
    - "Частина III. Ядро FastAPI":
      - Огляд: 03_fastapi_core/README.md
      - Що таке FastAPI: 03_fastapi_core/what_is_fastapi.md
      - Маршрути і валідація: 03_fastapi_core/routes_and_validation.md
      - Залежності і lifespan: 03_fastapi_core/dependencies.md
      - OpenAPI: 03_fastapi_core/openapi.md
      - FastAPI і DRF: 03_fastapi_core/fastapi_vs_drf.md
    - "Частина IV. Async і конкурентність":
      - Огляд: 04_async/README.md
    - "Частина V. Бази даних: SQLAlchemy async і Alembic":
      - Огляд: 05_databases/README.md
    - "Частина VI. Middleware, кеш і фонові задачі":
      - Огляд: 06_middleware_cache_jobs/README.md
    - "Частина VII. Тестування API":
      - Огляд: 07_testing/README.md
    - "Частина VIII. Безпека API":
      - Огляд: 08_security/README.md
    - "Частина IX. Інтеграції: AI, LLM, Telegram":
      - Огляд: 09_integrations/README.md
    - "Частина X. Docker, Compose і CI/CD":
      - Огляд: 10_docker_and_ci/README.md
  - Zero to Hero:
    - Огляд маршруту: tutorials/README.md
    - "Крок 1. Типи і Pydantic":
      - Огляд: tutorials/01_typing_pydantic/index.md
    - "Крок 2. Перший API на FastAPI":
      - Огляд: tutorials/02_fastapi_basics/index.md
      - FastAPI над NewsItem: tutorials/02_fastapi_basics/fastapi_app.md
      - Depends і lifespan: tutorials/02_fastapi_basics/depends_and_lifespan.md
      - "POST /api/scrape": tutorials/02_fastapi_basics/scrape_endpoint.md
      - OpenAPI і Postman: tutorials/02_fastapi_basics/openapi_and_postman.md
      - Async чи blocking: tutorials/02_fastapi_basics/async_measurements.md
      - Контрольна точка: tutorials/02_fastapi_basics/checkpoint.md
    - "Крок 3. База даних: SQLAlchemy і Alembic":
      - Огляд: tutorials/03_sqlalchemy_alembic/index.md
    - "Крок 4. Middleware, кеш і Redis":
      - Огляд: tutorials/04_middleware_redis/index.md
    - "Крок 5. Тестування API":
      - Огляд: tutorials/05_api_testing/index.md
    - "Крок 6. AI-інструменти розробника":
      - Огляд: tutorials/06_ai_dev_tools/index.md
    - "Крок 7. Аналіз новин через LLM API":
      - Огляд: tutorials/07_llm_api/index.md
    - "Крок 8. Безпека: JWT, SSRF, webhook":
      - Огляд: tutorials/08_security/index.md
    - "Крок 9. Telegram-бот":
      - Огляд: tutorials/09_telegram_bot/index.md
    - "Крок 10. Docker-образ":
      - Огляд: tutorials/10_docker/index.md
    - "Крок 11. Docker Compose і деплой":
      - Огляд: tutorials/11_compose_deploy/index.md
    - "Крок 12. CI/CD на GitHub Actions":
      - Огляд: tutorials/12_ci_cd/index.md
  - News Hub Deep Dive:
    - Огляд: deep_dive/README.md
  - Практика:
    - Огляд: labs/README.md
  - Довідник:
    - Огляд: reference/README.md
  - Викладачу: TEACHING_GUIDE.md
