site_name: News Hub — книга FastAPI
site_description: FastAPI від типів і Pydantic до Docker, Compose і CI/CD — на прикладі новинного агрегатора
site_url: https://nikoriakviktor.github.io/news_hub/
repo_url: https://github.com/NikoriakViktor/news_hub
repo_name: NikoriakViktor/news_hub
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
exclude_docs: |
  _internal/

theme:
  name: material
  language: uk
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.prune
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
  palette:
    - scheme: default
      primary: indigo
      accent: indigo

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      # Unicode-aware slugs: keep Cyrillic headings as anchors (the default slugify drops them)
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

plugins:
  - search:
      lang:
        - uk
        - en
  # Англійська додається пізніше: page.en.md поруч із page.md + мова en нижче (docs_structure: suffix)
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: uk
          default: true
          name: Українська
          build: true

validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: info
    unrecognized_links: warn

