site_name: News Hub — книга FastAPI
site_description: FastAPI від типів і Pydantic до Docker, Compose і CI/CD — на прикладі новинного агрегатора
site_url: https://nikoriakviktor.github.io/news_hub/
repo_url: https://github.com/NikoriakViktor/news_hub
repo_name: NikoriakViktor/news_hub
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
exclude_docs: |
  _internal/

theme:
  name: material
  language: uk
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.prune
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
  palette:
    - scheme: default
      primary: indigo
      accent: indigo

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      # Unicode-aware slugs: keep Cyrillic headings as anchors (the default slugify drops them)
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

plugins:
  - search:
      lang:
        - uk
        - en
  # Англійська додається пізніше: page.en.md поруч із page.md + мова en нижче (docs_structure: suffix)
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: uk
          default: true
          name: Українська
          build: true

validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: info
    unrecognized_links: warn

nav:
  - Головна: index.md
  - Як користуватися:
    - Вступ: 00_getting_started/README.md
    - Необхідні знання: 00_getting_started/prerequisites.md
    - Налаштування: 00_getting_started/local_setup.md
    - Структура репозиторію: 00_getting_started/repository_structure.md
    - Як читати кроки: 00_getting_started/how_to_use.md
  - Книга FastAPI:
    - "Частина I. HTTP і дизайн REST API":
      - Огляд: 01_http_and_rest/README.md
      - HTTP-запит і відповідь: 01_http_and_rest/http_anatomy.md
      - Методи HTTP: 01_http_and_rest/http_methods.md
      - Коди відповідей: 01_http_and_rest/status_codes.md
      - Принципи REST: 01_http_and_rest/rest_principles.md
      - Колекції і пагінація: 01_http_and_rest/collections.md
      - Версіонування API: 01_http_and_rest/versioning.md
      - Формат помилок: 01_http_and_rest/errors.md
      - Які бувають API: 01_http_and_rest/api_styles.md
    - "Частина II. Типи і Pydantic":
      - Огляд: 02_typing_and_pydantic/README.md
      - Анотації типів: 02_typing_and_pydantic/type_hints.md
