      - pydantic-settings і .env: 02_typing_and_pydantic/settings.md
      - ConfigDict: 02_typing_and_pydantic/config_dict.md
    - "Частина III. Ядро FastAPI":
      - Огляд: 03_fastapi_core/README.md
      - Що таке FastAPI: 03_fastapi_core/what_is_fastapi.md
      - Маршрути і валідація: 03_fastapi_core/routes_and_validation.md
      - Залежності і lifespan: 03_fastapi_core/dependencies.md
      - OpenAPI: 03_fastapi_core/openapi.md
