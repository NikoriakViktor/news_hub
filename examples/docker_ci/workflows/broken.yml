# Знайди помилки: дві з них GitHub покаже лише після push (workflow не запуститься), дві не покаже зовсім.
# Перевірка до push:  actionlint broken.yml   — розбір на сторінці «CI/CD на GitHub Actions».
name: broken
on: [pull_request]
permissions:
  contents: read
  package: write
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.pyhton }}
      - run: echo "title=${{ github.event.pull_request.title }}"
  deploy:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - run: echo ok
