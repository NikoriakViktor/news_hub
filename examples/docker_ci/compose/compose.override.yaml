# Розробка: Compose підхоплює цей файл сам, якщо поруч з compose.yaml і -f не вказано.
# Порти — лише на 127.0.0.1, щоб з мережі до API в обхід nginx і до Redis не дістатись.
services:
  api:
    ports:
      - "127.0.0.1:18111:8000"
    environment:
      UVICORN_LOG_LEVEL: debug
  redis:
    ports:
      - "127.0.0.1:18113:6379"
