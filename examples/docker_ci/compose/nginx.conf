# nginx перед прикладом: TLS тут, далі до api — звичайний HTTP усередині мережі edge.
upstream app {
    server api:8000;
}

server {
    listen 80;
    return 301 https://$host$request_uri;      # http → https
}

server {
    listen 443 ssl;
    server_name localhost;
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    # API під префіксом: /api/whoami → api:8000/whoami (коса риска в кінці proxy_pass зрізає /api/)
    location /api/ {
        proxy_pass http://app/;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://app;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-For   $remote_addr;   # перезаписати, а не дописати
        proxy_set_header X-Forwarded-Proto $scheme;        # https: застосунок знає, що TLS був
    }
}
